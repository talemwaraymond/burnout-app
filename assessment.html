<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Health Questionnaire (PHQ-9)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 font-roboto">
    <div class="container mx-auto p-4">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h1 class="text-2xl font-bold mb-4">Patient Health Questionnaire (PHQ-9)</h1>
            <p class="mb-4">The PHQ-9 is designed to diagnose depressive disorders and monitor the severity of depressive symptoms over time.</p>
            <form id="phq9-form" class="space-y-4">
                <div>
                    <label class="block text-lg font-medium mb-2">1. Little interest or pleasure in doing things.</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="q1" value="0" class="mr-2">Not at all</label>
                        <label><input type="radio" name="q1" value="1" class="mr-2">Several days</label>
                        <label><input type="radio" name="q1" value="2" class="mr-2">More than half the days</label>
                        <label><input type="radio" name="q1" value="3" class="mr-2">Nearly every day</label>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">2. Feeling down, depressed, or hopeless.</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="q2" value="0" class="mr-2">Not at all</label>
                        <label><input type="radio" name="q2" value="1" class="mr-2">Several days</label>
                        <label><input type="radio" name="q2" value="2" class="mr-2">More than half the days</label>
                        <label><input type="radio" name="q2" value="3" class="mr-2">Nearly every day</label>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">3. Trouble sleeping or sleeping too much.</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="q3" value="0" class="mr-2">Not at all</label>
                        <label><input type="radio" name="q3" value="1" class="mr-2">Several days</label>
                        <label><input type="radio" name="q3" value="2" class="mr-2">More than half the days</label>
                        <label><input type="radio" name="q3" value="3" class="mr-2">Nearly every day</label>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">4. Feeling tired or having little energy.</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="q4" value="0" class="mr-2">Not at all</label>
                        <label><input type="radio" name="q4" value="1" class="mr-2">Several days</label>
                        <label><input type="radio" name="q4" value="2" class="mr-2">More than half the days</label>
                        <label><input type="radio" name="q4" value="3" class="mr-2">Nearly every day</label>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">5. Poor appetite or overeating.</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="q5" value="0" class="mr-2">Not at all</label>
                        <label><input type="radio" name="q5" value="1" class="mr-2">Several days</label>
                        <label><input type="radio" name="q5" value="2" class="mr-2">More than half the days</label>
                        <label><input type="radio" name="q5" value="3" class="mr-2">Nearly every day</label>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">6. Feeling bad about oneself or like a failure.</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="q6" value="0" class="mr-2">Not at all</label>
                        <label><input type="radio" name="q6" value="1" class="mr-2">Several days</label>
                        <label><input type="radio" name="q6" value="2" class="mr-2">More than half the days</label>
                        <label><input type="radio" name="q6" value="3" class="mr-2">Nearly every day</label>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">7. Trouble concentrating.</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="q7" value="0" class="mr-2">Not at all</label>
                        <label><input type="radio" name="q7" value="1" class="mr-2">Several days</label>
                        <label><input type="radio" name="q7" value="2" class="mr-2">More than half the days</label>
                        <label><input type="radio" name="q7" value="3" class="mr-2">Nearly every day</label>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">8. Being noticeably slower or more restless than usual.</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="q8" value="0" class="mr-2">Not at all</label>
                        <label><input type="radio" name="q8" value="1" class="mr-2">Several days</label>
                        <label><input type="radio" name="q8" value="2" class="mr-2">More than half the days</label>
                        <label><input type="radio" name="q8" value="3" class="mr-2">Nearly every day</label>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">9. Thoughts of self-harm or suicide.</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="q9" value="0" class="mr-2">Not at all</label>
                        <label><input type="radio" name="q9" value="1" class="mr-2">Several days</label>
                        <label><input type="radio" name="q9" value="2" class="mr-2">More than half the days</label>
                        <label><input type="radio" name="q9" value="3" class="mr-2">Nearly every day</label>
                    </div>
                </div>
                <div>
                    <label class="block text-lg font-medium mb-2">How difficult have these problems made daily functioning (work, home life, or social interactions)?</label>
                    <div class="flex space-x-4">
                        <label><input type="radio" name="difficulty" value="0" class="mr-2">Not difficult at all</label>
                        <label><input type="radio" name="difficulty" value="1" class="mr-2">Somewhat difficult</label>
                        <label><input type="radio" name="difficulty" value="2" class="mr-2">Very difficult</label>
                        <label><input type="radio" name="difficulty" value="3" class="mr-2">Extremely difficult</label>
                    </div>
                </div>
                <button type="button" onclick="calculateResults()" class="bg-blue-500 text-white px-4 py-2 rounded">Submit</button>
            </form>
            <div id="results" class="mt-6 p-4 bg-gray-200 rounded-lg hidden">
                <h2 class="text-xl font-bold mb-2">Results</h2>
                <p id="score" class="mb-2"></p>
                <p id="severity" class="mb-2"></p>
                <p id="recommendation"></p>
            </div>
        </div>
    </div>

    <script>
        function calculateResults() {
            const form = document.getElementById('phq9-form');
            const formData = new FormData(form);
            let totalScore = 0;

            for (let [key, value] of formData.entries()) {
                if (key !== 'difficulty') {
                    totalScore += parseInt(value);
                }
            }

            let severity = '';
            let recommendation = '';

            if (totalScore <= 4) {
                severity = 'Minimal depression';
                recommendation = `
                    <ul class="list-disc pl-5">
                        <li>Join Work-Life Balance Support Groups (Virtual or In-Person) for proactive mental health maintenance.</li>
                        <li>Explore Self-Help Resources via Innerspark's library or app (e.g., mindfulness techniques, stress management tips).</li>
                        <li>Encourage bi-weekly self-assessments with PHQ-9 to track mood fluctuations.</li>
                    </ul>
                `;
            } else if (totalScore <= 9) {
                severity = 'Mild depression';
                recommendation = `
                    <ul class="list-disc pl-5">
                        <li>Attend Stress and Anxiety Support Groups to build coping strategies in a supportive setting.</li>
                        <li>Schedule a session with an Innerspark Licensed Therapist for personalized guidance.</li>
                        <li>Utilize Mindfulness Workshops offered through Innerspark for relaxation and focus.</li>
                        <li>Suggest monitoring with PHQ-9 after 2 weeks to assess progression.</li>
                    </ul>
                `;
            } else if (totalScore <= 14) {
                severity = 'Moderate depression';
                recommendation = `
                    <ul class="list-disc pl-5">
                        <li>Online Consultation and Therapy: Book a session with a licensed therapist to explore deeper emotional patterns and set actionable goals.</li>
                        <li>Enroll in a Virtual Support Group focused on mental health and resilience.</li>
                        <li>Consider structured programs like Cognitive Behavioral Therapy (CBT) modules provided through Innerspark’s platform.</li>
                        <li>Engage in Lifestyle Workshops for nutrition, sleep, and exercise improvements.</li>
                    </ul>
                `;
            } else if (totalScore <= 19) {
                severity = 'Moderately severe depression';
                recommendation = `
                    <ul class="list-disc pl-5">
                        <li>Begin regular therapy sessions via Online Consultation or schedule an in-person therapist visit.</li>
                        <li>Pair individual therapy with In-Person Support Groups for peer validation and encouragement.</li>
                        <li>Address immediate functional challenges with Crisis Intervention Services, if available.</li>
                        <li>Set a schedule for weekly follow-ups with the same or alternate PHQ-9 assessments.</li>
                    </ul>
                `;
            } else {
                severity = 'Severe depression';
                recommendation = `
                    <ul class="list-disc pl-5">
                        <li>Immediate Therapy Sessions: Offer priority access to licensed therapists for intensive care.</li>
                        <li>Refer to 24/7 Crisis Support Lines or local emergency services if self-harm risks are present.</li>
                        <li>Coordinate participation in High-Intensity Support Groups, such as addiction recovery (if applicable).</li>
                        <li>Encourage a Collaborative Care Plan involving a therapist, psychiatrist, and supportive peers.</li>
                        <li>Ensure frequent PHQ-9 monitoring (weekly or as deemed clinically necessary).</li>
                    </ul>
                `;
            }

            document.getElementById('score').innerText = `Total Score: ${totalScore}`;
            document.getElementById('severity').innerText = `Depression Severity: ${severity}`;
            document.getElementById('recommendation').innerHTML = `Recommendation: ${recommendation}`;

            document.getElementById('results').classList.remove('hidden');
        }
    </script>
</body>
</html>
